# Pipeline CI/CD — Module Rapprochement MB/CBS/PI
# Etapes : test -> quality -> build -> deploy
# Declenchement : push sur develop et main
#
# Secrets requis dans Settings > Secrets > Actions :
#   DEPLOY_HOST, DEPLOY_USER, SSH_KEY, POSTGRES_PASSWORD
name: CI/CD Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  IMAGE_NAME: ${{ github.repository_owner }}/reconciliation

# JOB 1 — TESTS UNITAIRES
jobs:
  test:
    name: Tests unitaires
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: reconciliation_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: cd backend && pip install --upgrade pip && pip install -r requirements.txt

      - name: Run migrations
        env:
          DJANGO_SETTINGS_MODULE: reconciliation_project.settings.testing
          POSTGRES_DB: reconciliation_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          DJANGO_SECRET_KEY: ci-secret-key
          REDIS_URL: redis://localhost:6379/0
        run: cd backend && python manage.py migrate

      - name: Run pytest
        env:
          DJANGO_SETTINGS_MODULE: reconciliation_project.settings.testing
          POSTGRES_DB: reconciliation_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          DJANGO_SECRET_KEY: ci-secret-key
          REDIS_URL: redis://localhost:6379/0
        run: cd backend && pytest --tb=short -v --cov=apps --cov-report=term-missing

# JOB 2 — QUALITE CODE (flake8 PEP8)
  quality:
    name: Qualite de code (flake8)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install flake8
      - name: Run flake8
        run: |
          cd backend
          flake8 . --max-line-length=120 \
            --exclude=migrations,__pycache__,.git,venv \
            --per-file-ignores="*/settings/*.py:F401,F403"

# JOB 3 — BUILD IMAGE DOCKER -> GHCR
  build:
    name: Build et Push Docker (GHCR)
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build et push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# JOB 4 — DEPLOIEMENT SSH serveur LICELI
  deploy:
    name: Deploiement serveur LICELI
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/rapprochement-mb-cbs-pi
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose exec -T web python manage.py migrate --noinput
            docker system prune -f
            echo "Deploiement termine."
