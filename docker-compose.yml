# Module Rapprochement MB/CBS/PI — LICELI Technologies
# 6 conteneurs : nginx | frontend | web | worker | redis | db
version: '3.9'

services:

  # 1. NGINX — point d'entrée unique
  nginx:
    image: nginx:1.25-alpine
    container_name: reconciliation_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - reconciliation_net

  # 2. FRONTEND — Vue.js 3 compilé (build multi-stage)
  frontend:
    build:
      context: ./frontend
    container_name: reconciliation_frontend
    restart: unless-stopped
    networks:
      - reconciliation_net

  # 3. WEB — Django + Gunicorn (API REST)
  web:
    image: ${GHCR_IMAGE_NAME:-reconciliation}:latest
    build:
      context: ./backend
    container_name: reconciliation_web
    command: >
      gunicorn reconciliation_project.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --timeout 120
      --access-logfile -
      --error-logfile -
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=reconciliation_project.settings.production
    volumes:
      - static_volume:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - reconciliation_net

  # 4. WORKER — Celery Beat + Celery Worker (batch nocturne)
  worker:
    image: ${GHCR_IMAGE_NAME:-reconciliation}:latest
    build:
      context: ./backend
    container_name: reconciliation_worker
    command: >
      sh -c "celery -A reconciliation_project beat --loglevel=info &
             celery -A reconciliation_project worker --loglevel=info --concurrency=2"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=reconciliation_project.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - reconciliation_net

  # 5. REDIS — message broker Celery (pas de données métier)
  redis:
    image: redis:7-alpine
    container_name: reconciliation_redis
    command: redis-server --save "" --appendonly no
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reconciliation_net

  # 6. DB — PostgreSQL 15 (base exclusive au module — CT-05)
  db:
    image: postgres:15-alpine
    container_name: reconciliation_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reconciliation_db}
      POSTGRES_USER: ${POSTGRES_USER:-reconciliation_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reconciliation_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reconciliation_net

volumes:
  postgres_data:
  static_volume:

networks:
  reconciliation_net:
    driver: bridge
